name: 功能建议
description: 建议新的页面、交互、无障碍或维护能力
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述希望看到的结果，不必限定技术实现。
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: 主要受众
      options:
        - 参观者
        - 内容维护者
        - 开发协作者
        - 无障碍技术使用者
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代办法
      description: 可选；说明目前如何绕过该问题。
